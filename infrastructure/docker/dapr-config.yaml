apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: cors-config
spec:
  api:
    cors:
      enabled: true
      allowedOrigins: ["http://localhost:3000"]
      allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowedHeaders: ["Origin", "Content-Type", "Accept", "Authorization", "dapr-app-id"]
      allowCredentials: true
