events { worker_connections 1024; }

http {
    server {
        listen 3500;

        location / {
            # 1. Handle browser preflight checks instantly
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-copilotkit-runtime-client-version' always;
                return 204;
            }

            # 2. Add CORS headers to active traffic
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # 3. Rewrite CopilotKit's URL layout into a perfect Dapr service invocation path
            # Turns: /invoke/info -> /v1.0/invoke/carqna-service/method/invoke/info
            rewrite ^/invoke/(.*)$ /v1.0/invoke/carqna-service/method/invoke/$1 break;

            # 4. Proxy the corrected URL down to the internal Dapr container
            proxy_pass http://carqna-dapr:3501;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
