
services:

  postgres:
    image: postgres
    restart: always
    container_name: postgres
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - carqna-network
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../infrastructure/docker/postgres/initdb.d:/docker-entrypoint-initdb.d

  opensearch:
    image: opensearch-with-mcp:latest
    build:
      context: ./opensearch-mcp
      dockerfile: Dockerfile
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-latest}
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=openSearch$2025
      - OPENSEARCH_JAVA_OPTS=-Xms512M -Xmx512M
      - plugins.ml_commons.mcp_server_enabled=true
      - plugins.ml_commons.mcp_connector_enabled=true
      - plugins.ml_commons.trusted_connector_endpoints_regex=["^https?://localhost.*"]
      - plugins.ml_commons.stream_enabled=true
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200 # REST API
      #- 9600:9600 # Performance Analyzer
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u 'admin:openSearch$2025' --silent --fail https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Crucial: gives OpenSearch time to bootstrap JVM
    networks:
      - carqna-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"  # S3 API Port
      - "9001:9001"  # Web Console Port
    environment:
      - RUSTFS_ACCESS_KEY=rustfs
      - RUSTFS_SECRET_KEY=rustfs
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - rustfs_data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - carqna-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger Web UI
      - "4317:4317"    # OpenTelemetry gRPC receiver
      - "4318:4318"    # OpenTelemetry HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - carqna-network

volumes:
  opensearch-data:
    driver: local
    name: opensearch-data
  postgres-data:
    driver: local
    name: postgres-data
  rustfs_data:
    driver: local
    name: rustfs-data

networks:
  carqna-network:
    driver: bridge
